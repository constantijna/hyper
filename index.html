/* Layout: kiosk split — left: route picker + map of Europe, right: door-to-door race + CO2. Single committed dark look in DHXI colours. */
:root{
  --ink:#191919;        /* DHXI near-black */
  --panel:#202624;
  --panel-2:#27302c;
  --line:#34403a;
  --text:#EEF3F0;
  --sage:#BDCFC5;       /* DHXI sage */
  --dim:#8C9C94;
  --green:#2EAB7B;      /* DHXI primary */
  --teal:#007256;       /* DHXI deep teal */
  --plane:#7A8681;
  --train:#BDCFC5;
  --loop:#2EAB7B;
  --font:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
sub{font-size:.62em;vertical-align:-.25em;line-height:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:max(16px,2vw);padding-block:14px 16px;gap:14px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:4px 0}
.brand b{font-weight:900;letter-spacing:.16em;font-size:15px;text-transform:uppercase}
.brand span{font-size:12px;color:var(--dim);letter-spacing:.04em}
.top .spacer{flex:1}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--dim);min-width:48px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-weight:700;font-size:14px;color:var(--sage)}
.toggle i{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle[aria-pressed="true"] i{background:var(--green)}
.toggle[aria-pressed="true"] i::after{transform:translateX(16px)}

.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;min-height:0}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px}

/* ---------- picker ---------- */
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.field{text-align:left;padding:14px 16px;border-radius:18px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .2s}
.field.active{border-color:var(--green)}
.field small{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.field strong{font-size:clamp(20px,2.2vw,28px);font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field em{font-style:normal;font-size:13px;color:var(--dim)}
.swap{width:52px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--sage)}
.swap svg{width:24px;height:24px}
.mapwrap{flex:1;min-height:260px;position:relative;overflow:hidden;padding:0}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mapwrap .land,.mapwrap .cend{vector-effect:non-scaling-stroke}
.maphint{position:absolute;left:14px;bottom:12px;font-size:13px;color:var(--dim);background:color-mix(in srgb,var(--ink) 70%,transparent);padding:6px 10px;border-radius:10px;pointer-events:none}
.land{fill:var(--panel-2);stroke:var(--line);stroke-width:.8}
.cdot{fill:var(--dim)}
.chit{fill:transparent;cursor:pointer}
.cend{fill:var(--ink);stroke:var(--green);stroke-width:3}
.clabel{fill:var(--text);font-weight:900;paint-order:stroke;stroke:var(--ink);stroke-linejoin:round}
.r-flight{fill:none;stroke:var(--plane);stroke-width:2.5;stroke-dasharray:3 7;stroke-linecap:round}
.r-loop{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round}
.r-loop.anim{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- results ---------- */
.res{padding:18px 20px;display:flex;flex-direction:column;gap:14px;flex:1 1 auto}
.res .lanes{flex:1 1 auto;justify-content:space-evenly}
.res-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.res-head h2{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:900;text-wrap:balance}
.res-head .km{color:var(--dim);font-weight:700}
.res-head .spacer{flex:1}
.btn{padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-weight:800;font-size:14px;color:var(--sage);display:inline-flex;gap:8px;align-items:center}
.btn svg{width:16px;height:16px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.lanes{display:flex;flex-direction:column;gap:12px}
.lane{display:grid;grid-template-columns:120px minmax(0,1fr) 150px;gap:14px;align-items:center}
.lane .who{display:flex;align-items:center;gap:10px;font-weight:800}
.lane .who svg{width:26px;height:26px;flex:none;color:var(--c)}
.lane .who span{line-height:1.1}
.lane .who small{display:block;font-size:11px;font-weight:700;color:var(--dim)}
.track{position:relative;height:40px;border-radius:12px;background:var(--panel-2);overflow:visible}
.segs{position:absolute;inset:0;display:flex;border-radius:12px;overflow:hidden}
.segs i{height:100%;display:block;flex:none}
.segs i+i{box-shadow:inset 2px 0 0 var(--ink)}
.s-ride{background:var(--c)}
.s-wait{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,transparent) 0 5px,color-mix(in srgb,var(--c) 20%,transparent) 5px 10px)}
.s-go{background:color-mix(in srgb,var(--c) 32%,transparent)}
.marker{position:absolute;top:50%;left:0;width:38px;height:38px;margin-left:-19px;transform:translateY(-50%);border-radius:50%;background:var(--ink);border:2px solid var(--c);display:grid;place-items:center;color:var(--c);z-index:2}

.lane .time small{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-top:4px}
.lane.win .time{color:var(--green)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 75%,transparent);display:grid;place-items:center;padding:16px}

/* ---------- assumptions (editable in settings) ---------- */
const DEFAULTS = {
  p_to:45, p_check:90, p_speed:800, p_taxi:30, p_after:20, p_from:40, p_route:1.05, p_short:0.25, p_long:0.15,
  t_to:15, t_wait:10, t_speed:150, t_route:1.2, t_from:15, t_wh:60,
  l_to:15, l_wait:10, l_speed:1000, l_acc:1.0, l_route:1.1, l_from:15, l_wh:40,
  grid:0.22, greenF:0.012, tree:22, idle:60
};
const GROUPS = {plane:["p_to","p_check","p_taxi","p_speed","p_route","p_after","p_from","p_short","p_long"],train:["t_to","t_wait","t_speed","t_route","t_from","t_wh"],loop:["l_to","l_wait","l_speed","l_acc","l_route","l_from","l_wh"],co2:["grid","greenF","tree"],kiosk:["idle"]};
const STORE_KEY = "dh-reisvergelijker-v1";
let S = Object.assign({}, DEFAULTS);
try{ const raw = localStorage.getItem(STORE_KEY); if(raw) Object.assign(S, JSON.parse(raw)); }catch(e){}

const CITIES = DATA.cities.map(c=>({id:c[0],nl:c[1],en:c[2],cc:c[3],lat:c[4],lon:c[5],x:c[6],y:c[7]}));
const byId = Object.fromEntries(CITIES.map(c=>[c.id,c]));
const DEFAULT_ROUTE = ["dlf","par"];

let lang = "nl", green = false, from = byId[DEFAULT_ROUTE[0]], to = byId[DEFAULT_ROUTE[1]], active = "from";
const $ = s=>document.querySelector(s), $$ = s=>Array.from(document.querySelectorAll(s));
const L = ()=>T[lang];
const cname = c=>c[lang];

/* ---------- maths ---------- */
function haversine(a,b){
  const R=6371, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function hyperRideMin(km){
  const d=km*1000, v=S.l_speed/3.6, a=Math.max(0.05,S.l_acc);
  const t = d >= v*v/a ? d/v + v/a : 2*Math.sqrt(d/a);   // trapezoid / triangle speed profile
  return t/60;
}
function compute(a,b){
  const km = haversine(a,b);
  const grid = green ? S.greenF : S.grid;
  const planeRide = km*S.p_route/S.p_speed*60 + S.p_taxi;
  const trainKm = km*S.t_route, loopKm = km*S.l_route;
  const modes = [
    {k:"plane", segs:[["go",S.p_to],["wait",S.p_check],["ride",planeRide],["wait",S.p_after],["go",S.p_from]],
      co2: km*(km<500?S.p_short:S.p_long)},
    {k:"train", segs:[["go",S.t_to],["wait",S.t_wait],["ride",trainKm/S.t_speed*60],["go",S.t_from]],
      co2: trainKm*S.t_wh/1000*grid},
    {k:"loop", segs:[["go",S.l_to],["wait",S.l_wait],["ride",hyperRideMin(loopKm)],["go",S.l_from]],
      co2: loopKm*S.l_wh/1000*grid}
  ];
  modes.forEach(m=>m.total=m.segs.reduce((s,x)=>s+x[1],0));
  return {km, modes};
}
function fmtDur(min){
  min=Math.max(0,Math.round(min));
  const h=Math.floor(min/60), m=min%60, l=L();
  return h ? `${h} ${l.h} ${String(m).padStart(2,"0")} ${l.min}` : `${m} ${l.min}`;
}
function fmtKg(kg){ return kg<10 ? kg.toFixed(1).replace(".", lang==="nl"?",":".") : Math.round(kg).toLocaleString(lang==="nl"?"nl-NL":"en-GB"); }

/* ---------- map ---------- */
const NS="http://www.w3.org/2000/svg";
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function buildMap(){
  const svg=$("#map");
  mk("path",{d:DATA.land,class:"land"},svg);
  const routeG=mk("g",{id:"routeG"},svg);
  const dots=mk("g",{},svg);
  CITIES.forEach(c=>{
    mk("circle",{cx:c.x,cy:c.y,r:3.2,class:"cdot"},dots);
    const hit=mk("circle",{cx:c.x,cy:c.y,r:14,class:"chit","data-id":c.id},dots);
    hit.addEventListener("click",()=>choose(c));
  });
  mk("g",{id:"endsG"},svg);
}
let vb=[70,30,780,660], vbRAF=0;
function targetVB(a,b){
  const svg=$("#map"), cw=svg.clientWidth||460, ch=svg.clientHeight||600, asp=cw/ch;
  let x0=Math.min(a.x,b.x), x1=Math.max(a.x,b.x), y0=Math.min(a.y,b.y), y1=Math.max(a.y,b.y);
  let w=Math.max(x1-x0,1), h=Math.max(y1-y0,1);
  const pad=Math.max(w,h)*.35+70;
  w+=pad*2; h+=pad*2; w=Math.max(w,300); h=Math.max(h,300);
  if(w/h<asp) w=h*asp; else h=w/asp;
  if(w>1000){w=1000;h=w/asp;} if(h>760){h=760;w=Math.min(1000,h*asp);}
  let cx=(x0+x1)/2, cy=(y0+y1)/2;
  let x=Math.min(Math.max(cx-w/2,0),1000-w), y=Math.min(Math.max(cy-h/2,0),760-h);
  return [x,y,w,h];
}
function zoomTo(t,anim){
  cancelAnimationFrame(vbRAF);
  const svg=$("#map"), s0=vb.slice(), t0=performance.now(), D=anim?700:0;
  const cw=svg.clientWidth||460;
  const size=(k)=>{ // keep dots and labels a constant on-screen size
    $$("#map .cdot").forEach(c=>c.setAttribute("r",3.2*k));
    $$("#map .chit").forEach(c=>c.setAttribute("r",16*k));
    $$("#map .cend").forEach(c=>c.setAttribute("r",8*k));
    const f=$("#map .r-flight"), lp=$("#map .r-loop");
    if(f){f.style.strokeWidth=2.5*k;f.style.strokeDasharray=`${3*k} ${7*k}`;} if(lp) lp.style.strokeWidth=4*k;
    $$("#map .clabel").forEach(l=>{l.setAttribute("font-size",17*k);l.setAttribute("stroke-width",5*k);const dx=+l.dataset.dx;l.setAttribute("x",+l.dataset.x+dx*k);l.setAttribute("y",+l.dataset.y+6*k);});
  };
  function step(now){
    const p=D?Math.min(1,(now-t0)/D):1, e=1-Math.pow(1-p,3);
    vb=s0.map((v,i)=>v+(t[i]-v)*e);
    svg.setAttribute("viewBox",vb.map(v=>v.toFixed(2)).join(" "));
    size(vb[2]/cw);
    if(p<1) vbRAF=requestAnimationFrame(step);
  }
  vbRAF=requestAnimationFrame(step);
}
function drawRoute(anim){
  const g=$("#routeG"), e=$("#endsG"); g.innerHTML=""; e.innerHTML="";
  const a=from,b=to;
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, bend=Math.min(120,len*.28);
  const nx=-dy/(len||1), ny=dx/(len||1); const s = ny>0?-1:1;
  mk("path",{d:`M${a.x},${a.y} Q${mx+nx*bend*s},${my+ny*bend*s} ${b.x},${b.y}`,class:"r-flight"},g);
  mk("path",{d:`M${a.x},${a.y} L${b.x},${b.y}`,class:"r-loop anim",pathLength:"1",style:"--len:1"},g);
  [[a,"A"],[b,"B"]].forEach(([c])=>{
    mk("circle",{cx:c.x,cy:c.y,r:8,class:"cend"},e);
  });
  // labels, nudged to stay inside the frame
  [[a,b],[b,a]].forEach(([c,o])=>{
    const t=mk("text",{class:"clabel",x:c.x,y:c.y},e); t.textContent=cname(c).replace(/ \(.*\)/,"");
    const left = c.x < o.x ? true : false;
    t.setAttribute("text-anchor", left?"end":"start");
    t.dataset.x=c.x; t.dataset.y=c.y; t.dataset.dx=left?-14:14;
  });
  zoomTo(targetVB(a,b), anim && !matchMedia("(prefers-reduced-motion: reduce)").matches);
}

function buildNet(){
  const svg=$("#net");
  mk("path",{d:DATA.land,class:"land"},svg);
  const hubs=["ams","dlf","bru","par","lon","fra","ber","muc","mil","zrh","mad","bcn","lys","vie","prg","waw","cph","ham","rom","bud"];
  const links=[["lon","par"],["ams","par"],["dlf","bru"],["ams","fra"],["ams","ham"],["ham","cph"],["ham","ber"],["ber","waw"],["ber","prg"],["prg","vie"],["vie","bud"],["fra","muc"],["muc","vie"],["fra","zrh"],["zrh","mil"],["mil","rom"],["par","lys"],["lys","bcn"],["bcn","mad"],["lys","mil"],["bru","fra"]];
  links.forEach(([p,q],i)=>{const a=byId[p],b=byId[q];mk("path",{d:`M${a.x},${a.y}L${b.x},${b.y}`,class:"lnk",style:`animation-delay:${-i*.37}s`},svg);});
  hubs.forEach(h=>{const c=byId[h];mk("circle",{cx:c.x,cy:c.y,r:5,class:"hub"},svg);});
}

/* ---------- render ---------- */
let raceRAF=0;
function render(anim=true){
  const l=L();
  $("#fromName").textContent=cname(from); $("#fromCountry").textContent=l.countries[from.cc];
  $("#toName").textContent=cname(to); $("#toCountry").textContent=l.countries[to.cc];
  $("#fFrom").classList.toggle("active",active==="from"); $("#fTo").classList.toggle("active",active==="to");
  drawRoute(anim);
  const r=compute(from,to);
  $("#routeTitle").textContent=`${cname(from)} → ${cname(to)}`;
  $("#routeKm").textContent=`${Math.round(r.km).toLocaleString(lang==="nl"?"nl-NL":"en-GB")} ${l.km}`;
  const max=Math.max(...r.modes.map(m=>m.total));
  const best=r.modes.reduce((a,b)=>a.total<b.total?a:b);
  const plane=r.modes[0];
  const lanes=$("#lanes"); lanes.innerHTML="";
  r.modes.forEach(m=>{
    const lane=document.createElement("div"); lane.className="lane"+(m===best?" win":""); lane.style.setProperty("--c",`var(--${m.k})`);
    const sub = m.k==="loop" ? l.future : (m.k==="plane" && r.km<300 ? l.shortFlight : "");
    const diff = m.k==="plane" ? "" : (m.total<plane.total ? l.faster(fmtDur(plane.total-m.total)) : l.slower(fmtDur(m.total-plane.total)));
    lane.innerHTML=`<div class="who">${IC[m.k]}<span>${l[m.k]}${sub?`<small>${sub}</small>`:""}</span></div>
      <div class="track"><div class="segs">${m.segs.map(s=>`<i class="s-${s[0]}" style="width:${(s[1]/max*100).toFixed(3)}%"></i>`).join("")}</div><div class="marker">${IC[m.k]}</div></div>
      <div class="time num"><span class="clock">${fmtDur(m.total)}</span><span class="flag">${lang==="nl"?"Winnaar":"Winner"}</span><small class="act">${diff||"&nbsp;"}</small></div>`;
    lane._m=m; lane._diff=diff; lanes.appendChild(lane);
  });
  // CO2
  const cmax=Math.max(...r.modes.map(m=>m.co2));
  $("#cbars").innerHTML=r.modes.map(m=>`<div class="cbar" style="--c:var(--${m.k})"><span>${l[m.k]}</span><div class="b"><i data-w="${(m.co2/cmax*100).toFixed(2)}"></i></div><span class="v num">${fmtKg(m.co2)} <small>${l.kg}</small></span></div>`).join("");
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$("#cbars i").forEach(i=>i.style.width=i.dataset.w+"%")));
  const saved=plane.co2-r.modes[2].co2, trees=Math.max(1,Math.round(saved/S.tree));
  const treeIcons = IC.tree.repeat(Math.min(trees,40));
  $("#save").innerHTML = saved>=5
    ? `<div class="big num">${fmtKg(saved)} ${l.kg}</div><p>${l.saveLine(saved,trees)}</p><div class="trees" aria-hidden="true">${treeIcons}</div>`
    : `<p>${l.saveNone}</p>`;
  race(anim);
}
function race(anim){
  cancelAnimationFrame(raceRAF);
  const lanes=$$("#lanes .lane"); if(!lanes.length) return;
  const max=Math.max(...lanes.map(x=>x._m.total));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DUR = (anim && !reduce) ? Math.min(20000, Math.max(12000, max*28)) : 0; // ~12–20 s so each stage is visible
  const box=$("#lanes"); box.classList.toggle("racing",!!DUR); box.dataset.skip=L().skip;
  let skip=false; box.onclick=()=>{skip=true;};
  const t0=performance.now();
  function frame(now){
    const p = (DUR && !skip) ? Math.min(1,(now-t0)/DUR) : 1;
    const tMin = p*max;
    lanes.forEach(lane=>{
      const m=lane._m, done=tMin>=m.total, cur=Math.min(tMin,m.total);
      const pct=cur/max*100;
      lane.querySelector(".segs").style.clipPath=`inset(0 ${100-pct}% 0 0 round 12px)`;
      lane.querySelector(".marker").style.left=pct+"%";
      lane.querySelector(".clock").textContent=fmtDur(cur);
      lane.classList.toggle("done",done);
      // show what the traveller is doing right now
      let acc=0, idx=m.segs.length-1;
      for(let i=0;i<m.segs.length;i++){ if(cur < acc+m.segs[i][1]){idx=i;break;} acc+=m.segs[i][1]; }
      const act=lane.querySelector(".act");
      act.innerHTML = done ? (p<1 ? `<b>${L().arrived}</b>` : (lane._diff||"&nbsp;")) : L().acts[m.k][idx];
      lane.querySelectorAll(".segs i").forEach((el,i)=>el.classList.toggle("now",!done&&i===idx));
    });
    if(p<1) raceRAF=requestAnimationFrame(frame); else box.classList.remove("racing");
  }
  raceRAF=requestAnimationFrame(frame);
}

function applyLang(){
  const l=L();
  document.documentElement.lang=lang;
  $$("[data-t]").forEach(e=>{const v=l[e.dataset.t]; if(typeof v==="string") e.innerHTML=v;});
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  $("#q").placeholder=l.search;
}

/* ---------- choosing cities ---------- */
function choose(c){
  if(active==="from"){ if(c===to){to=from;} from=c; active="to"; }
  else { if(c===from){from=to;} to=c; active="from"; }
  render(true);
}
function openCities(which){
  active=which; const l=L();
  $("#cityTitle").textContent = which==="from"?l.pickFrom:l.pickTo;
  $("#q").value=""; fillCities("");
  $("#citySheet").hidden=false;
}
function fillCities(q){
  const l=L(), cur = active==="from"?from:to, other = active==="from"?to:from;
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const nq=norm(q.trim());
  const list=CITIES.filter(c=>!nq||norm(c.nl).includes(nq)||norm(c.en).includes(nq)||norm(l.countries[c.cc]).includes(nq));
  const groups={}; list.forEach(c=>(groups[c.cc]=groups[c.cc]||[]).push(c));
  const order=Object.keys(groups).sort((a,b)=> (a==="NL"?-1:b==="NL"?1:l.countries[a].localeCompare(l.countries[b],lang)));
  $("#cityList").innerHTML = order.length ? order.map(cc=>`<div class="country"><h4>${l.countries[cc]}</h4><div class="grid">${
    groups[cc].sort((a,b)=>cname(a).localeCompare(cname(b),lang)).map(c=>`<button data-id="${c.id}" class="${c===cur?"cur":""}" ${c===other?"disabled":""}>${cname(c)}</button>`).join("")
  }</div></div>`).join("") : `<p class="empty">${l.none}</p>`;
}
$("#cityList").addEventListener("click",e=>{
  const b=e.target.closest("button[data-id]"); if(!b||b.disabled) return;
  $("#citySheet").hidden=true; choose(byId[b.dataset.id]);
});
$("#q").addEventListener("input",e=>fillCities(e.target.value));
$("#fFrom").addEventListener("click",()=>openCities("from"));
$("#fTo").addEventListener("click",()=>openCities("to"));
$("#swap").addEventListener("click",()=>{[from,to]=[to,from];render(true);});
$("#replay").addEventListener("click",()=>{render(true);});
$$("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".sheet").hidden=true));
$$(".sheet").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)s.hidden=true;}));

$$("[data-lang]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();lang=b.dataset.lang;applyLang();render(false);}));
$("#green").addEventListener("click",()=>{green=!green;$("#green").setAttribute("aria-pressed",String(green));render(false);});

/* ---------- attract screen ---------- */
function showAttract(){
  $$(".sheet").forEach(s=>s.hidden=true);
  lang="nl"; green=false; $("#green").setAttribute("aria-pressed","false");
  from=byId[DEFAULT_ROUTE[0]]; to=byId[DEFAULT_ROUTE[1]]; active="from";
  applyLang(); render(false);
  $("#attract").hidden=false;
}
function start(){ $("#attract").hidden=true; render(true); poke(); }
$("#attract").addEventListener("click",start);
$("#attract").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")start();});

/* ---------- idle reset ---------- */
let idleT=0;
function poke(){ clearTimeout(idleT); if(!$("#attract").hidden) return; idleT=setTimeout(showAttract, Math.max(10,S.idle)*1000); }
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,poke,{passive:true}));

/* ---------- hidden settings: tap brand 5x ---------- */
let taps=[];
$("#brand").addEventListener("click",()=>{
  const now=Date.now(); taps=taps.filter(t=>now-t<2500); taps.push(now);
  if(taps.length>=5){taps=[];openSettings();}
});
function openSettings(){
  const l=L();
  $("#setForm").innerHTML=Object.entries(GROUPS).map(([g,keys])=>`<fieldset><legend>${l.groups[g]}</legend>${
    keys.map(k=>`<label for="s_${k}">${l.f[k]}<input id="s_${k}" name="${k}" type="number" inputmode="decimal" step="any" value="${S[k]}"></label>`).join("")
  }</fieldset>`).join("");
  $("#setSheet").hidden=false;
}
$("#setForm").addEventListener("submit",e=>e.preventDefault());
$("#setSave").addEventListener("click",()=>{
  $$("#setForm input").forEach(i=>{const v=parseFloat(String(i.value).replace(",", ".")); if(isFinite(v)&&v>=0) S[i.name]=v;});
  try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}
  $("#setSheet").hidden=true; render(true);
});
$("#setReset").addEventListener("click",()=>{S=Object.assign({},DEFAULTS);try{localStorage.removeItem(STORE_KEY);}catch(e){} openSettings(); render(false);});

/* ---------- boot ---------- */
buildMap(); buildNet(); applyLang(); render(false);
window.addEventListener("resize",()=>zoomTo(targetVB(from,to),false));
window.__dh={compute,byId,S};
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
document.addEventListener("gesturestart",function(e){e.preventDefault();});
document.addEventListener("contextmenu",function(e){e.preventDefault();});
</script>
